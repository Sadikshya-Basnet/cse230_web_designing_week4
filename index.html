<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Slider Library</title>

    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <main class="slider-container">
        <h1>Image Slider Library</h1>
        <p>Explore beautiful landscapes</p>

        <div class="slider">
            <div class="slider-track">
                <img src="images/mountain.png" alt="Mountain landscape">
                <img src="images/beach.png" alt="Beautiful beach">
                <img src="images/forest.png" alt="Green forest">
                <img src="images/lake.png" alt="Peaceful lake">
                <img src="images/sunset.png" alt="Colorful sunset">
            </div>

            <button class="arrow prev" aria-label="Previous image">
                &#10094;
            </button>

            <button class="arrow next" aria-label="Next image">
                &#10095;
            </button>
        </div>

        <div class="slider-dots" aria-label="Choose an image"></div>
    </main>

</body>
</html>
